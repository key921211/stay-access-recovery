spring:
  application:
    name: stay-access-recovery
  datasource:
    url: jdbc:h2:file:./data/access-recovery;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
    username: sa
    password: ''
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

recovery:
  scheduling:
    enabled: true
  poll-delay-ms: 1000
  retry-delay-ms: 5000

doorlock:
  fake:
    scenario: SUCCESS

app:
  seed-demo-reservations: true
